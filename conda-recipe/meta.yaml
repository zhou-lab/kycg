{% set name = "kycg" %}
{% set version = "0.7" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # In-repo recipe: build the checked-out tree (with its YAME submodule and
  # YAME's nested htslib). CI builds the pushed commit; a release build = check
  # out the vX.Y.Z tag, then conda build.
  path: ..

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    # Pins the glibc/macOS SDK the binary is built against (see
    # conda_build_config.yaml) and adds the matching `__glibc >=2.17` /
    # `__osx >=11.0` run constraint, so the package will not install on a host
    # that is too old to run it.
    - {{ stdlib('c') }}
    - make
  host:
    - zlib
    - libcurl
  run:
    # zlib and libcurl each carry run_exports that pin the runtime
    # automatically; listed for clarity.
    - zlib
    - libcurl

test:
  requires:
    # The suite packs its own fixtures with `yame pack`, so it needs the yame
    # COMMAND -- which kycg does not ship: it links libyame statically but
    # installs one binary. That is also exactly what a user needs for the
    # documented `yame info` row-space check, so depending on it here tests
    # the install instructions as well as the code.
    - yame
  source_files:
    # The command-level tests, and the docs they check the binary against.
    # Run against the INSTALLED package rather than a build tree: conda-build
    # rewrites library paths at install time, so on macOS a binary in the
    # build directory cannot load libz yet.
    - tests/
    - docs/
    - README.md
  commands:
    # --version prints the knowledgebase tags this build can verify, so it
    # exercises the compiled-in registry rather than just the binary loading.
    - kycg --version
    # --version reports the YAME version this build is coupled to (kycg links
    # libyame.a statically from the pinned submodule). Assert it is printed, so
    # a build that somehow linked the wrong/older backend is caught here rather
    # than at run time. libcurl is no longer kycg's concern -- YAME owns and
    # requires it -- so there is nothing to probe on that front.
    - kycg --version | grep -qE "YAME[[:space:]]+v[0-9]"
    # The suite itself: statistics, options, error paths, docs consistency.
    - KYCG=kycg YAME=yame bash tests/run.sh

about:
  home: https://github.com/zhou-lab/kycg
  license: LicenseRef-CHOP-Academic-BSD-2-Clause
  license_family: OTHER
  license_file: LICENSE
  summary: Functional analysis of DNA methylation at CpG resolution — set enrichment over a curated knowledgebase compendium.
  description: |
    kycg is a dependency-light C reimplementation of the knowYourCG
    R/Bioconductor package, built on YAME's bit-packed CpG formats. It tests a
    CpG query set against knowledgebases of genomic annotation — chromatin
    states, CpG islands, repeats, transcription factor binding, tissue
    signatures — reporting a hypergeometric tail probability in log space, six
    effect-size coefficients, and a group-stratified Benjamini-Hochberg false
    discovery rate. Results agree with the R package to floating-point
    tolerance.

    Its other half is `kycg fetch`, a browsable catalogue of the knowledgebase
    compendium for human and mouse whole-genome CpG references and seven
    Infinium array platforms, with a verified download path: every collection
    publishes a SHA256SUMS whose digest is compiled into the binary, so a
    download is checked against a pin the build carries rather than against
    whatever the server serves. Nothing is downloaded outside that command.

    The only runtime dependencies are zlib and libcurl.
  dev_url: https://github.com/zhou-lab/kycg
  doc_url: https://github.com/zhou-lab/kycg/blob/main/README.md

extra:
  recipe-maintainers:
    - zwdzwd
